version: '3.8'

services:
  # Managed PostgreSQL Database for production/local containerized dev
  db:
    image: postgres:16-alpine
    container_name: smartquote-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartquote}
      POSTGRES_USER: ${POSTGRES_USER:-smartquote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartquote_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartquote} -d ${POSTGRES_DB:-smartquote}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 3 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartquote-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smartquote}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartquote}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartquote_secure_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # React Frontend (Optional containerized web client)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartquote-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
